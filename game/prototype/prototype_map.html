<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heroes — Adventure Interface</title>
<style>
  :root{
    --sbw: clamp(300px, 25vw, 430px);      /* ширина правой панели */
    --gold:#c9a25a;  --gold-hi:#f3d68c;
    --frame:#5a1010; --frame-dk:#2e0606;
    --panel:#4a0d0d; --slot:#241608;
  }
  *{margin:0;padding:0;box-sizing:border-box;user-select:none}
  html,body{height:100%}
  body{background:#000;overflow:hidden;font-family:Georgia,'Times New Roman',serif}
  img{display:block}

  /* ========== ВНЕШНЯЯ РАМКА ========== */
  #game{
    position:fixed; inset:0;
    display:grid;
    grid-template-columns:minmax(0,1fr) var(--sbw);
    grid-template-rows:auto minmax(0,1fr);   /* строка даты + карта */
    gap:10px; padding:14px;
    background:var(--frame);
    box-shadow:inset 0 0 0 2px var(--gold), inset 0 0 0 6px var(--frame-dk),
               inset 0 0 80px rgba(0,0,0,.8);
  }
  .orb{position:absolute;width:26px;height:26px;border-radius:50%;z-index:9;
    background:radial-gradient(circle at 35% 30%, #ffb4b4, #e02222 45%, #6d0000 85%);
    box-shadow:0 0 0 3px var(--gold), 0 2px 8px #000;}
  .tl{top:5px;left:5px}.tr{top:5px;right:5px}
  .bl{bottom:5px;left:5px}.br{bottom:5px;right:5px}

  /* ========== ДАТА НАД КАРТОЙ ========== */
  #datebar{grid-column:1;grid-row:1;height:34px;
    display:flex;align-items:center;justify-content:center;
    color:#ffe9a8;font-size:15px;letter-spacing:.5px;text-shadow:1px 1px 0 #000;
    border:3px solid var(--gold);box-shadow:0 0 0 2px var(--frame-dk);
    background:linear-gradient(#8e1b1b,#5a1010)}

  /* ========== КАРТА ========== */
  #viewport{grid-column:1;grid-row:2;position:relative;min-height:0;overflow:hidden;
    border:3px solid var(--gold);box-shadow:0 0 0 2px var(--frame-dk);background:#000}
  #map{position:absolute;inset:0;background:url('assets/map.png') center/cover;
    image-rendering:pixelated}
  #tooltip{position:absolute;left:0;right:0;bottom:0;padding:5px 12px;text-align:center;
    color:#f5e6c8;letter-spacing:.5px;text-shadow:1px 1px 0 #000;
    background:linear-gradient(#4a3018,#2a1a0c);border-top:2px solid var(--gold)}

  /* ========== ПРАВАЯ КОЛОНКА (на всю высоту) ========== */
  #sidebar{grid-column:2;grid-row:1/-1;
    display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:10px;min-height:0}

  /* миникарта + компас */
  #minimap-panel{position:relative;padding:24px 32px;background:var(--panel);
    border:3px solid var(--gold);box-shadow:0 0 0 2px var(--frame-dk)}
  #minimap{width:100%;aspect-ratio:4/3;border:2px solid var(--gold-hi);
    background:url('assets/minimap.png') center/cover;image-rendering:pixelated}
  .compass{position:absolute;color:var(--gold-hi);font-weight:bold;font-size:17px;
    text-shadow:1px 1px 0 #000}
  .compass.n{top:2px;left:50%;transform:translateX(-50%)}
  .compass.s{bottom:2px;left:50%;transform:translateX(-50%)}
  .compass.w{left:9px;top:50%;transform:translateY(-50%)}
  .compass.e{right:9px;top:50%;transform:translateY(-50%)}

  /* герои / кнопки / замок */
  #adventure-panel{display:grid;grid-template-columns:auto 1fr auto;gap:8px;padding:8px;
    background:var(--panel);border:3px solid var(--gold);box-shadow:0 0 0 2px var(--frame-dk)}
  .slot-col{display:grid;grid-template-rows:repeat(5,1fr);gap:6px;width:62px}
  .slot{position:relative;min-height:42px;background:var(--slot);border:2px solid #000;
    box-shadow:inset 0 0 0 1px #5a3a1a, inset 0 3px 8px #000;
    display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden}
  .slot img{width:100%;height:100%;object-fit:cover}

  /* полоски жизни/маны на иконке героя */
  .bars{position:absolute;left:3px;top:4px;bottom:4px;display:flex;gap:2px;z-index:2}
  .bar{width:4px;background:#000;box-shadow:0 0 0 1px #000;position:relative;overflow:hidden}
  .bar i{position:absolute;left:0;right:0;bottom:0;display:block}
  .bar.hp i{height:72%;background:linear-gradient(#8dff6a,#1e9c1e)}
  .bar.mp i{height:55%;background:linear-gradient(#7ec8ff,#1448c8)}

  #buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
  #buttons button{min-height:42px;font-size:20px;line-height:1;color:#ffe9a8;cursor:pointer;
    background:linear-gradient(#a82525,#6d1212);
    border:2px solid;border-color:#e8c878 #4a0808 #4a0808 #e8c878;
    box-shadow:inset 0 0 6px #000;text-shadow:0 0 4px #000}
  #buttons button:hover{filter:brightness(1.25)}
  #buttons button:active{transform:translateY(1px)}

  /* ========== ПАНЕЛЬ ГЕРОЯ ========== */
  #hero-panel{display:grid;grid-template-columns:auto minmax(0,1fr);
    grid-template-rows:auto minmax(0,1fr);gap:8px 10px;padding:10px;
    background:var(--panel);border:3px solid var(--gold);box-shadow:0 0 0 2px var(--frame-dk);
    min-height:0;overflow:hidden}
  #hero-portrait{grid-column:1;grid-row:1;width:clamp(84px,8vw,120px);
    border:2px solid var(--gold);box-shadow:0 0 0 2px var(--frame-dk);overflow:hidden}
  #hero-portrait img{width:100%;height:100%;object-fit:cover;object-position:top}
  #hero-top{grid-column:2;grid-row:1;display:flex;flex-direction:column;gap:6px;min-width:0}
  #hero-name{color:#f5e6c8;font-size:18px;letter-spacing:1px;text-shadow:1px 1px 0 #000}
  #hero-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .stat{background:var(--slot);border:2px solid #000;box-shadow:inset 0 0 0 1px #5a3a1a;
    padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:2px}
  .stat .ico{font-size:15px}
  .stat .val{color:#fff;font-size:14px;text-shadow:1px 1px 0 #000}

  /* армия: мини-колонка построения + сетка 4×2 */
  #army{grid-column:1/-1;grid-row:2;display:grid;
    grid-template-columns:auto minmax(0,1fr);gap:6px;min-height:0}
  #army-side{display:grid;grid-template-rows:1fr 1fr;gap:6px;width:36px}
  #army-side button{font-size:14px;line-height:1;color:#ffe9a8;cursor:pointer;
    background:linear-gradient(#a82525,#6d1212);
    border:2px solid;border-color:#e8c878 #4a0808 #4a0808 #e8c878;
    box-shadow:inset 0 0 4px #000;text-shadow:0 0 3px #000}
  #army-side button:hover{filter:brightness(1.25)}
  #army-grid{display:grid;grid-template-columns:repeat(4,1fr);
    grid-template-rows:repeat(2,minmax(40px,1fr));gap:6px}
  .unit{position:relative;background:var(--slot);border:2px solid #000;
    box-shadow:inset 0 0 0 1px #5a3a1a, inset 0 4px 10px #000;
    display:flex;align-items:center;justify-content:center;font-size:clamp(16px,1.8vw,24px)}
  .unit .count{position:absolute;right:3px;bottom:1px;font-size:12px;color:#fff;
    text-shadow:1px 1px 0 #000}
</style>
</head>
<body>
<div id="game">
  <div class="orb tl"></div><div class="orb tr"></div>
  <div class="orb bl"></div><div class="orb br"></div>

  <!-- Карта приключений -->
  <main id="viewport" title="Двойной клик — полный экран">
    <div id="map"></div>
  </main>

  <!-- Правая колонка -->
  <aside id="sidebar">
  <!-- Дата над картой -->
  <div id="datebar">Месяц: 1, Неделя: 1, День: 1</div>
    
    <section id="minimap-panel">
      <span class="compass n">N</span><span class="compass s">S</span>
      <span class="compass w">W</span><span class="compass e">E</span>
      <div id="minimap"></div>
    </section>

    <section id="adventure-panel">
      <div class="slot-col">
        <div class="slot">
          <img src="assets/portrait.png" alt="">
          <span class="bars">
            <span class="bar hp" title="Жизнь"><i></i></span>
            <span class="bar mp" title="Мана"><i></i></span>
          </span>
        </div>
        <div class="slot"></div><div class="slot"></div>
        <div class="slot"></div><div class="slot"></div>
      </div>

      <div id="buttons">
        <button title="Королевство">🏰</button><button title="Флаг">🚩</button>
        <button title="Лагерь">⛺</button><button title="Конь">🐎</button>
        <button title="Корабль">🚢</button><button title="Кузница">⚒️</button>
        <button title="Поиск">🔍</button><button title="Шлем">🪖</button>
        <button title="Свиток">📜</button><button title="Конец хода">⏳</button>
      </div>

      <div class="slot-col">
        <div class="slot">🏰</div>
        <div class="slot"></div><div class="slot"></div>
        <div class="slot"></div><div class="slot"></div>
      </div>
    </section>

    <section id="hero-panel">
      <div id="hero-portrait"><img src="assets/portrait.png" alt="Darkstorn"></div>
      <div id="hero-top">
        <div id="hero-name">Darkstorn</div>
        <div id="hero-stats">
          <div class="stat"><span class="ico">⚔️</span><span class="val">0</span></div>
          <div class="stat"><span class="ico">🛡️</span><span class="val">0</span></div>
          <div class="stat"><span class="ico">🔮</span><span class="val">4</span></div>
          <div class="stat"><span class="ico">📖</span><span class="val">2</span></div>
        </div>
      </div>

      <div id="army">
        <div id="army-side">
          <button title="Построение: вместе">🛡️</button>
          <button title="Построение: свободно">⚔️</button>
        </div>
        <div id="army-grid">
          <div class="unit">🗡️<span class="count">103</span></div>
          <div class="unit">🏹<span class="count">36</span></div>
          <div class="unit">🐴<span class="count">34</span></div>
          <div class="unit">📜<span class="count">10</span></div>
          <div class="unit">🛡️<span class="count">20</span></div>
          <div class="unit">🧙<span class="count">12</span></div>
          <div class="unit">⚔️<span class="count">6</span></div>
          <div class="unit">🐎<span class="count">12</span></div>
        </div>
      </div>
    </section>
  </aside>
</div>

<script>
  // Двойной клик по карте — переход в полный экран и обратно
  document.getElementById('viewport').addEventListener('dblclick', () => {
    document.fullscreenElement
      ? document.exitFullscreen()
      : document.documentElement.requestFullscreen();
  });
</script>
</body>
</html>
