[pytest]
# -x УБРАН из addopts (fixed-green-семья CI-4, раунд 6 §2): с -x свит молча
# вставал на первом фейле ("11 passed" при collected 39 — неполный прогон
# выглядел как почтизелёный). Гейт и CI-2 — полный прогон всегда.
# Dev-режим: pytest -x <файл> вручную.
addopts = -vs --tb=short
# Реестр маркеров (T-329, срез test-suite-restructure 3.4/5.3). Маркер заведён
# только вместе с тестом, который его несёт: реестр «на будущее» превращает
# опечатку в молчаливый ноль собранных тестов, а `pytest -m smoke`, ничего не
# собирая, выглядит как зелёный прогон. `slow` появится вместе с первым
# дорогим тестом — до этого времени его в реестре нет намеренно.
markers =
    smoke: критичный путь живым Godot (меню → мир); слой smoke берёт его только по явному MCP_SMOKE=1
