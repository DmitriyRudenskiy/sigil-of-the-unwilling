<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Экран героя — Аджит</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body{
    background:#f5f5f7; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    font-family:Georgia,'Times New Roman',serif; color:#e6cf9a; cursor:default;
  }
  .window{
    width:942px; background:#4a3423; padding:6px;
    border:2px solid #16100a; outline:2px solid #8a6a3a;
    box-shadow:0 12px 30px rgba(0,0,0,.35);
  }
  .panel{
    background:radial-gradient(circle at 30% 20%, rgba(255,255,255,.05), transparent 60%),
               linear-gradient(#4a3524,#41301f);
    border:1px solid #241608; box-shadow:inset 0 0 0 1px #6b4e2e;
  }
  .top{ display:flex; gap:6px; align-items:stretch; }

  /* ===== Левая панель ===== */
  .left{ width:412px; display:flex; flex-direction:column; }
  .hero-head{ display:flex; gap:8px; padding:8px; align-items:center; }
  .portrait{ width:80px; height:80px; flex:none; background:#201812;
    border:2px solid #0d0906; box-shadow:inset 0 0 8px #000; }
  .hero-name{ flex:1; text-align:center; }
  .hero-name h1{ font-size:16px; letter-spacing:1px; color:#f0dcae; }
  .hero-name p{ font-size:12px; margin-top:6px; font-weight:bold; }

  .stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px;
    padding:2px 8px; text-align:center; font-size:11px; }
  .icon{ background:#2c1c10; border:2px solid #170d06; box-shadow:inset 0 0 8px #000;
    display:flex; align-items:center; justify-content:center; font-size:22px; }
  .stat .icon{ width:46px; height:46px; margin:5px auto 0; }
  .stat-values{ display:grid; grid-template-columns:repeat(4,1fr); text-align:center;
    margin:6px 8px 0; padding:2px 0; font-size:13px;
    background:#3a281a; border:1px solid #241608; }

  .row{ display:flex; gap:6px; padding:7px 8px 0; align-items:stretch; }
  .icon.small{ width:42px; height:42px; flex:none; font-size:18px; }
  .label{ flex:1; font-size:12px; line-height:1.35; padding-left:2px; align-self:center; }

  .skills{ flex:1; display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:8px; }
  .skill{ display:flex; gap:6px; min-height:46px; }
  .skill i{ width:46px; background:#3a281a; border:1px solid #241608; box-shadow:inset 0 0 6px #000; }
  .skill b{ flex:1; background:#3a281a; border:1px solid #241608; box-shadow:inset 0 0 6px #000; }

  /* ===== Правая панель (экипировка) ===== */
  .right{ flex:1; display:flex; flex-direction:column; }
  .doll{ position:relative; flex:1; min-height:452px; }
  .fig{ position:absolute; left:96px; top:2px; width:240px; height:360px;
    filter:drop-shadow(0 0 1px #d8c0a0) drop-shadow(0 0 1px #d8c0a0); }
  .slot{ position:absolute; width:56px; height:56px; background:#3a2415;
    border:2px solid #201006; box-shadow:inset 0 0 10px rgba(0,0,0,.85);
    display:flex; align-items:center; justify-content:center; font-size:22px; }

  .inv{ display:flex; gap:5px; justify-content:center; padding:6px; }
  .inv .slot{ position:static; }
  .arrow{ width:22px; height:56px; background:#3a2415; border:2px solid #201006;
    color:#c9a86a; font-size:12px; }
  .actions{ display:flex; justify-content:space-between; padding:10px 14px; }
  .actions button{ width:58px; height:46px; background:#3a2415; border:2px solid #201006;
    color:#e8c86a; font-size:20px; box-shadow:inset 0 0 6px #000; }

  /* ===== Боковая колонка ===== */
  .side{ width:80px; background:#7a100c; border:1px solid #3a0806;
    display:flex; flex-direction:column; align-items:center; gap:8px; padding:8px 6px; }
  .banner,.mini{ width:62px; height:62px; border:2px solid #2a0505; }
  .mini{ height:46px; background:#201812; }
  .side-slot{ width:62px; height:42px; background:#4a3423; border:2px solid #241608;
    box-shadow:inset 0 0 6px #000; }
  .ok{ margin-top:auto; width:62px; height:46px; background:#3a2415; border:2px solid #201006;
    color:#e8c86a; font-size:26px; }

  /* ===== Нижняя панель (армия) ===== */
  .bottom{ margin-top:6px; background:#7a100c; border:1px solid #3a0806;
    padding:9px; display:flex; gap:6px; align-items:center; }
  .army{ width:76px; height:76px; background:#8a1210; border:2px solid #40080a;
    box-shadow:inset 0 0 10px #000; position:relative; flex:none; }
  .army.filled{ background:#241a12; }
  .cren{ position:absolute; inset:0; display:flex; align-items:center;
    justify-content:center; font-size:36px; }
  .army b{ position:absolute; right:4px; bottom:2px; color:#fff; font-size:14px;
    text-shadow:1px 1px 0 #000; }
  .formations{ margin-left:auto; display:grid; grid-template-columns:repeat(2,64px); gap:5px; }
  .formations button{ height:34px; background:#3a2415; border:2px solid #201006;
    color:#c9a86a; font-size:14px; }
</style>
</head>
<body>
<div class="window">
  <div class="top">

    <!-- Левая панель: характеристики -->
    <section class="left panel">
      <header class="hero-head">
        <div class="portrait">
          <svg viewBox="0 0 80 80" width="80" height="80">
            <rect width="80" height="80" fill="#2a2a2e"/>
            <circle cx="40" cy="48" r="16" fill="#c8a080"/>
            <path d="M24 36 l4 -16 6 11 6 -15 6 15 6 -11 4 16z" fill="#9aa0a8"/>
          </svg>
        </div>
        <div class="hero-name">
          <h1>Аджит</h1>
          <p>Уровень 1 Лорд</p>
        </div>
      </header>

      <div class="stats">
        <div class="stat">Атака<div class="icon">⚔️</div></div>
        <div class="stat">Защита<div class="icon">🛡️</div></div>
        <div class="stat">Сила Магии<div class="icon">📖</div></div>
        <div class="stat">Знание<div class="icon">📚</div></div>
      </div>
      <div class="stat-values"><span>2</span><span>2</span><span>1</span><span>1</span></div>

      <div class="row">
        <div class="icon small">👁️</div>
        <div class="label">Специальность<br>Созерцатели</div>
        <div class="icon small">🦅</div>
        <div class="icon small">☠️</div>
      </div>
      <div class="row">
        <div class="icon small">🎖️</div><div class="label">Опыт<br>34</div>
        <div class="icon small">📜</div><div class="label">Мана<br>10/10</div>
      </div>
      <div class="row">
        <div class="icon small">🎺</div><div class="label">Основной<br>Лидерство</div>
        <div class="icon small">🛡️</div><div class="label">Основной<br>Сопротивление</div>
      </div>

      <div class="skills">
        <div class="skill"><i></i><b></b></div><div class="skill"><i></i><b></b></div>
        <div class="skill"><i></i><b></b></div><div class="skill"><i></i><b></b></div>
        <div class="skill"><i></i><b></b></div><div class="skill"><i></i><b></b></div>
      </div>
    </section>

    <!-- Правая панель: экипировка и инвентарь -->
    <section class="right panel">
      <div class="doll">
        <svg class="fig" viewBox="0 0 240 360">
          <g fill="#9d1212">
            <path d="M120 8a17 17 0 0 1 17 17 17 17 0 0 1-12 16l2 7c18 5 28 15 32 32l5 30 7 100c1 11-11 14-15 5l-11-68 3 100c0 10-13 10-13 0l-5-75-5 75c0 10-13 10-13 0l3-100-11 68c-4 9-16 6-15-5l7-100 5-30c4-17 14-27 32-32l2-7a17 17 0 0 1-12-16 17 17 0 0 1 17-17z"/>
            <path d="M104 66 40 50a9 9 0 1 0-5 17l66 18z"/>
            <path d="M152 92c22 60 26 120 16 150l-16 30-8-46z"/>
          </g>
        </svg>
        <div class="slot" style="left:258px; top:6px;"></div>
        <div class="slot" style="left:318px; top:6px;"></div>
        <div class="slot" style="left:180px; top:66px;">📿</div>
        <div class="slot" style="left:6px;  top:58px;"></div>
        <div class="slot" style="left:68px; top:58px;"></div>
        <div class="slot" style="left:318px; top:68px;"></div>
        <div class="slot" style="left:180px; top:146px;"></div>
        <div class="slot" style="left:318px; top:130px;">🕯️</div>
        <div class="slot" style="left:6px;  top:160px;">🗿</div>
        <div class="slot" style="left:22px; top:230px;"></div>
        <div class="slot" style="left:318px; top:218px;"></div>
        <div class="slot" style="left:46px; top:300px;"></div>
        <div class="slot" style="left:258px; top:298px;"></div>
        <div class="slot" style="left:6px;  top:370px;"></div>
        <div class="slot" style="left:68px; top:370px;"></div>
        <div class="slot" style="left:318px; top:392px;"></div>
      </div>

      <div class="inv">
        <button class="arrow">◀</button>
        <div class="slot"></div><div class="slot"></div><div class="slot"></div>
        <div class="slot"></div><div class="slot"></div><div class="slot"></div>
        <button class="arrow">▶</button>
      </div>
      <div class="actions">
        <button>📜</button><button>🧰</button><button>⊘</button>
      </div>
    </section>

    <!-- Боковая колонка -->
    <aside class="side">
      <div class="banner">
        <svg viewBox="0 0 62 62" width="62" height="62">
          <rect width="62" height="62" fill="#8a1210"/>
          <g stroke="#e8c86a" stroke-width="4" fill="none">
            <path d="M12 22 31 12 50 22"/><path d="M12 36 31 26 50 36"/><path d="M12 50 31 40 50 50"/>
          </g>
        </svg>
      </div>
      <div class="mini">
        <svg viewBox="0 0 62 46" width="62" height="46">
          <rect width="62" height="46" fill="#2a2a2e"/>
          <circle cx="31" cy="28" r="11" fill="#c8a080"/>
          <path d="M20 20 l3 -10 4 7 4 -9 4 9 4 -7 3 10z" fill="#9aa0a8"/>
        </svg>
      </div>
      <div class="side-slot"></div><div class="side-slot"></div><div class="side-slot"></div>
      <div class="side-slot"></div><div class="side-slot"></div><div class="side-slot"></div>
      <div class="side-slot"></div>
      <button class="ok">✓</button>
    </aside>
  </div>

  <!-- Нижняя панель: армия -->
  <footer class="bottom">
    <div class="army filled"><span class="cren">🦎</span><b>38</b></div>
    <div class="army filled"><span class="cren">👁️</span><b>3</b></div>
    <div class="army"></div><div class="army"></div><div class="army"></div>
    <div class="army"></div><div class="army"></div>
    <div class="formations">
      <button>⚏</button><button>⚐</button>
      <button>⚍</button><button>⇄</button>
    </div>
  </footer>
</div>
</body>
</html>
