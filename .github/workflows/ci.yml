# CI-2 (kickoff, 14-я итерация §4): четырёхуровневый гейт + чекеры + логи.
# Уровни: (1) GdUnit4 unit, (2) integration, (3) functional — всё в run_tests.sh
# одним прогоном GdUnitCmdTool; (4) MCP e2e (pytest + godot-mcp, живой Godot
# под Xvfb). Чекеры: связность доков (check_docs_links.py). Политика exit —
# в run_tests.sh (GdUnit 0/101 → GATE=0; MCP-секция молчать не имеет права).
name: CI-2 gate

on:
  push:
    branches: [main]
  pull_request:

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: System deps (Xvfb + X/GL libs for live Godot)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb unzip libgl1 libglu1-mesa libxcursor1 libxinerama1 \
            libxrandr2 libxi6 libxkbcommon0 libasound2t64 libpulse-dev \
            python3 python3-pip nodejs npm
          # ubuntu-22.04 отдаёт libasound2 как пакет libasound2; t64-имя — на 24.04.
          sudo apt-get install -y --no-install-recommends libasound2 || true

      - name: Godot ${{ env.GODOT_VERSION }}
        run: |
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          echo "GODOT_BIN=$PWD/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"

      - name: MCP e2e deps (venv-fallback: системный python3 — поддерживаемая конфигурация)
        run: |
          python3 -m pip install --user pytest pytest-timeout mcp anyio
          npm ci --prefix game/addons/godot-mcp

      - name: Checker — связность доков
        run: python3 scripts/check_docs_links.py

      - name: Gate — run_tests.sh (GdUnit4 + MCP e2e)
        # DISPLAY не задан: run_tests.sh сам поднимает Xvfb на свободном дисплее.
        run: ./game/run_tests.sh 2>&1 | tee run_tests.log

      - name: Upload logs (артефакт всегда — и на зелёном, и на красном)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci2-logs
          path: |
            run_tests.log
          if-no-files-found: warn
