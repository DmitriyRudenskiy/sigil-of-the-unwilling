# CI-2 (тикет CI-2, TICKETS.md): GitHub Actions — гейт 4 уровня + чекеры + artifact-логи.
# Гейт = GdUnit4 + MCP e2e (run_tests.sh, таблица exit-кодов закодирована в скрипте:
# GdUnit 0/101 → зелёный, 100/105 → красный; pytest 0 → зелёный, 1/2/3/5 → красный)
# + DOCS-LINKS (check_docs_links.py, битая ссылка → красный) + чекеры (ci2_checkers.sh:
# пары .gd/.uid и ассет/.import, case-дубли, маркеры конфликтов, YAML).
# Райдер парности (13-я итерация §0): чекеры — на PR, не только на main.
#
# ci-speedup (2026-10-14): 1 job → 4 параллельных job'а (static / gdunit / mcp / verdict).
# Baseline (D-148): было 6м41с (38443410901, f0817a00): MCP 259с, GdUnit 69с, lint 26с,
# setup ~31с. Семантика гейта инвариантна: workflow красный ⇔ любой из static/gdunit/mcp
# красный; verdict — репортёр (always(), exit 0): 4-уровневая строка (D-147) +
# CI-2 Stability (D-174 — мониторинг, не гейт). Кэши: Godot-бинарь, venv'ы, node_modules.
name: CI-2

on:
  push: # AC тикета CI-2: «на каждый push/PR»
    branches: ['**']
  pull_request:

concurrency:
  group: ci2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: "Static (checkers + lint + DOCS-LINKS)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Checkers (uid pairs, case dups, conflict markers, asset+.import, YAML)
        run: |
          # pipefail выключен: RC снимаем явно (иначе -e убивает шаг до
          # level-строки; гейт — последняя команда шага)
          set +o pipefail
          bash scripts/ci2_checkers.sh 2>&1 | tee /tmp/ci2-checkers.log
          RC=${PIPESTATUS[0]}
          echo "CHECKERS: $([ $RC -eq 0 ] && echo OK || echo RED)" >> /tmp/ci2-levels.txt
          [ $RC -eq 0 ]

      - name: Lint venv cache
        id: lint-venv-cache
        uses: actions/cache@v4
        with:
          path: /tmp/ci2-lint-venv
          key: ci2-lint-venv-gdtoolkit-4.5.0

      - name: "Lint (gdtoolkit: gdparse — gate; gdlint — delta-гейт этапа 1, D-172)"
        # Раунд 10 §3.4: lint — отдельный шаг. gdparse (синтаксис) гейтит.
        # Раунд 9 §3 (gdlint этап 1, GDLINT-PROPOSAL «утверждён»): гигиена
        # (trailing-whitespace/mixed-tabs/unnecessary-pass/is_finite) вычищена
        # (431+2); гейт — ДЕЛЬТА: число нарушений > baseline = красный,
        # ≤ baseline = report-only. Понижать baseline можно только вниз
        # (списанием max-line-length/duplicated-load), raising = красный CI.
        run: |
          set +o pipefail
          if [ ! -x /tmp/ci2-lint-venv/bin/gdparse ]; then
            python3 -m venv /tmp/ci2-lint-venv
            /tmp/ci2-lint-venv/bin/pip install -q gdtoolkit==4.5.0
          fi
          cd game
          GDPARSE_RC=0
          find scripts tests -name "*.gd" -print0 \
            | xargs -0 -n50 /tmp/ci2-lint-venv/bin/gdparse || GDPARSE_RC=$?
          find scripts tests -name "*.gd" -print0 \
            | xargs -0 -n50 /tmp/ci2-lint-venv/bin/gdlint 2>/tmp/ci2-gdlint.txt >/dev/null || true
          N=$(grep -cE '\.gd:[0-9]+: Error' /tmp/ci2-gdlint.txt || true)
          BASELINE=335
          echo "GDLINT: violations=$N baseline=$BASELINE (дельта-гейт этапа 1)"
          echo "LINT: gdparse=$([ $GDPARSE_RC -eq 0 ] && echo OK || echo RED) gdlint=$N (baseline=$BASELINE)" >> /tmp/ci2-levels.txt
          if [ "$N" -gt "$BASELINE" ]; then
            echo "RED: gdlint вырос над baseline (+$((N-BASELINE))) — новые нарушения стиля не принимаются"
            grep -E '\.gd:[0-9]+: Error' /tmp/ci2-gdlint.txt | head -50
            exit 1
          fi
          [ "$GDPARSE_RC" -eq 0 ]

      - name: "DOCS-LINKS (check_docs_links.py)"
        run: |
          set +o pipefail
          python3 scripts/check_docs_links.py 2>&1 | tee /tmp/ci2-docs-links.log
          RC=${PIPESTATUS[0]}
          echo "DOCS-LINKS: $([ $RC -eq 0 ] && echo OK || echo RED)" >> /tmp/ci2-levels.txt
          [ $RC -eq 0 ]

      - name: "Artifact (static: level-строки + логи)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci2-static-logs
          path: |
            /tmp/ci2-levels.txt
            /tmp/ci2-checkers.log
            /tmp/ci2-docs-links.log
            /tmp/ci2-gdlint.txt
          if-no-files-found: ignore

  gdunit:
    name: "GdUnit4 (+ balance metrics)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Godot cache
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: /tmp/godot
          key: godot-4.7-stable-linux-x86_64

      - name: "Godot 4.7-stable (linux x86_64)"
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/godot
          curl -sfL https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip -o /tmp/godot/Godot.zip
          unzip -q /tmp/godot/Godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7-stable_linux.x86_64
          /tmp/godot/Godot_v4.7-stable_linux.x86_64 --version

      - name: "GdUnit4 (эшелонирование, раунд 7 §1.3)"
        env:
          GODOT_BIN: /tmp/godot/Godot_v4.7-stable_linux.x86_64
        run: |
          # Эшелонирование: суб-гейты отдельными шагами — пал суб-гейт видно
          # без тела лога (jobs-API conclusion). Флаг exit-кодов — в run_tests.sh.
          # pipefail выключен: RC снимаем явно (гейт — последняя команда шага).
          set +o pipefail
          cd game
          "$GODOT_BIN" --headless --path . --import >/dev/null 2>&1 || true
          "$GODOT_BIN" --headless --path . -s addons/gdunit4/bin/GdUnitCmdTool.gd \
            --ignoreHeadlessMode -c -a res://tests 2>&1 | tee /tmp/ci2-gdunit.log
          RC=${PIPESTATUS[0]}
          echo "GDUNIT RC=$RC (0/101 = зелёный, политика CI-2/T-114)"
          {
            echo "GDUNIT: RC=$RC (0/101=зелёный)"
            grep -aE "Overall Summary" /tmp/ci2-gdunit.log | tail -1
          } >> /tmp/ci2-levels.txt
          [ "$RC" -eq 0 ] || [ "$RC" -eq 101 ]

      - name: "Balance metrics (T-041: трассы композита → artifact, не гейт)"
        # Гейт якорей — тесты test_t041_anchors (GdUnit4); шаг пишет трассы
        # баланс-прогона (кривые запасов, WARN/DEFICIT, Престиж-сальдо,
        # потери) в артефакт — baseline-точка регрессии чисел.
        env:
          GODOT_BIN: /tmp/godot/Godot_v4.7-stable_linux.x86_64
        run: |
          cd game
          "$GODOT_BIN" --headless --path . --script res://scripts/balance/balance_metrics.gd \
            2>&1 | tee /tmp/ci2-balance.log | grep -a ANCHOR || true
        continue-on-error: true

      - name: "Artifact (balance report)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balance-report
          path: |
            game/balance_report.json
            /tmp/ci2-balance.log
          if-no-files-found: ignore

      - name: "Diagnostics (if: failure — раунд 7 §1.3 п.1: диагноз в видимый лог)"
        if: failure()
        env:
          GODOT_BIN: /tmp/godot/Godot_v4.7-stable_linux.x86_64
        run: |
          echo "=== godot --version ==="; /tmp/godot/Godot_v4.7-stable_linux.x86_64 --version || true
          echo "=== GODOT_BIN resolution ==="; echo "GODOT_BIN=$GODOT_BIN"; ls -la /tmp/godot/ || true
          echo "=== tail: gdunit log ==="; tail -40 /tmp/ci2-gdunit.log 2>/dev/null || echo "(нет)"
          # Канал без токена: ::error::-аннотации публичны через
          # GET /repos/{o}/{r}/check-runs/{id}/annotations (проверено 2026-10-12).
          echo "::error::=== DIAG gdunit (итог/падения) ==="
          sed "s/\r//g" /tmp/ci2-gdunit.log 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' | grep -aE 'Overall Summary|FAILED|Parse Error|Can.t load' | tail -12 | while IFS= read -r l; do echo "::error::G1 ${l:0:170}"; done

      - name: "Artifact (gdunit: log + level-строки)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci2-gdunit-logs
          path: |
            /tmp/ci2-gdunit.log
            /tmp/ci2-levels.txt
          if-no-files-found: ignore

  mcp:
    name: "MCP e2e (2 workers, xdist)"
    runs-on: ubuntu-latest
    # 30 мин: 3 ретрая CI-1(12) × худший случай (2 застопоренных проба × 420с,
    # T-125-класс). MCP_WORKERS=2 (не 3): 3 воркера на 4 ядра = contention →
    # T-125-стоп пробов на раннере (ран 38485389297: 20m timeout, 3 попытки).
    # 3 воркера — после фикса T-125 (см. tasks.md 4.x).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: System deps (Xvfb — MCP e2e запускает живой Godot, не headless; Godot runtime-libs)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libfontconfig1 libxcursor1 libxinerama1 \
            libxrandr2 libxi6 libgl1 libasound2t64 libpulse0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: MCP venv cache
        id: mcp-venv-cache
        uses: actions/cache@v4
        with:
          path: /tmp/ci2-mcp-venv
          key: ci2-mcp-venv-v1 # v1 = pytest+pytest-timeout+mcp+anyio+pytest-xdist; bump при смене состава

      - name: "Python venv (pytest + pytest-timeout + mcp + anyio + pytest-xdist)"
        run: |
          if [ ! -x /tmp/ci2-mcp-venv/bin/pytest ]; then
            python3 -m venv /tmp/ci2-mcp-venv
            /tmp/ci2-mcp-venv/bin/pip install -q pytest pytest-timeout mcp anyio pytest-xdist
          fi
          # импорт-проверка = валидация кэша (сломанный кэш — красный, bump ключа)
          /tmp/ci2-mcp-venv/bin/python -c "import pytest, pytest_timeout, mcp, anyio, xdist; print('mcp-venv: ok (xdist', xdist.__version__ + ')')"

      - name: Godot cache
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: /tmp/godot
          key: godot-4.7-stable-linux-x86_64

      - name: "Godot 4.7-stable (linux x86_64)"
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/godot
          curl -sfL https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip -o /tmp/godot/Godot.zip
          unzip -q /tmp/godot/Godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7-stable_linux.x86_64
          /tmp/godot/Godot_v4.7-stable_linux.x86_64 --version

      - name: node_modules cache
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: game/addons/godot-mcp/node_modules
          key: ${{ runner.os }}-godot-mcp-npm-${{ hashFiles('game/addons/godot-mcp/package-lock.json') }}

      - name: "MCP server (npm ci + build)"
        working-directory: game/addons/godot-mcp
        run: |
          if [ ! -f node_modules/.package-lock.json ]; then
            npm ci
          fi
          npm run build

      # .godot-кэш тёплый ДО тестов (урок рана 38494830653, 2026-10-14): в базовом
      # single-job CI GdUnit делал --import перед MCP; в отдельном MCP-джобе .godot
      # холодный — параллельные холодные импорты под contention (2 воркера на 4
      # ядра) сдвигают старт Godota за wait_ready-бюджет → цепочка
      # stop/wait_ready-висов >480с → 30m timeout. --import до xdist = как в baseline.
      - name: "Godot import (тёплый .godot до MCP-старта)"
        run: |
          /tmp/godot/Godot_v4.7-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --import > /tmp/godot-import.log 2>&1 || true
          tail -3 /tmp/godot-import.log

      - name: "MCP e2e (MCP_WORKERS=2; ретраи CI-1(12) на раннер-окружение)"
        env:
          GODOT_BIN: /tmp/godot/Godot_v4.7-stable_linux.x86_64
          MCP_PYTEST_PY: /tmp/ci2-mcp-venv/bin/python
          MCP_WORKERS: 2
        run: |
          # Ретрай-политика CI-1(12) распространена на раннер явно (раунд 7 §1.3):
          # холодное окружение/шаренная среда дают «Not connected to game
          # interaction server» — до 3 попыток, лог каждой сохраняется.
          # MCP_WORKERS=2 (ci-speedup): xdist, порты 9090/9091 (conftest _worker_port).
          # Не 3: contention на 4 ядрах открывает T-125-стоп (ран 38485389297).
          cd game
          RC=1
          for attempt in 1 2 3; do
            echo "=== MCP attempt $attempt ==="
            SKIP_GDUNIT=1 bash run_tests.sh > /tmp/ci2-mcp-$attempt.log 2>&1 && RC=0 || RC=$?
            if [ "$RC" -eq 0 ]; then break; fi
            echo "MCP attempt $attempt failed (rc=$RC)"
            sleep 15
          done
          cat /tmp/ci2-mcp-$attempt.log
          cp /tmp/ci2-mcp-$attempt.log /tmp/ci2-gate-mcp.log
          {
            echo "MCP: rc=$RC attempt=$attempt (2 workers)"
            grep -aE "PYTEST LEDGER|workers \[" /tmp/ci2-gate-mcp.log | tail -3
          } >> /tmp/ci2-levels.txt
          exit "$RC"

      - name: "Diagnostics (if: failure — раунд 7 §1.3 п.1: диагноз в видимый лог)"
        if: failure()
        env:
          GODOT_BIN: /tmp/godot/Godot_v4.7-stable_linux.x86_64
        run: |
          echo "=== godot --version ==="; /tmp/godot/Godot_v4.7-stable_linux.x86_64 --version || true
          echo "=== GODOT_BIN resolution ==="; echo "GODOT_BIN=$GODOT_BIN"; ls -la /tmp/godot/ || true
          echo "=== DISPLAY / Xvfb ==="; echo "DISPLAY=${DISPLAY:-пусто}"; pgrep -af Xvfb || echo "Xvfb: процессов нет"; command -v xdpyinfo || echo "xdpyinfo: не установлен"
          echo "=== python venv (MCP) ==="; /tmp/ci2-mcp-venv/bin/python -c "import mcp, anyio, pytest, xdist; print('mcp/anyio/pytest/xdist — ок')" || true
          echo "=== node ==="; node --version; ls game/addons/godot-mcp/build/index.js || echo "MCP server build отсутствует"
          echo "=== tail: mcp logs ==="; for f in /tmp/ci2-mcp-*.log; do echo "--- $f"; tail -40 "$f"; done 2>/dev/null || echo "(нет)"
          # Канал без токена: ::error::-аннотации публичны через
          # GET /repos/{o}/{r}/check-runs/{id}/annotations (проверено 2026-10-12).
          # Исполнитель читает диагноз без доступа к телу лога (раунд 7 §1.3).
          emit() { sed "s/\r//g" "$1" 2>/dev/null | grep -aE "$2" | grep -avE 'Statistics|PASSED|Node.js 20' | tail -14 | while IFS= read -r l; do echo "::error::${l:0:180}"; done; }
          echo "::error::=== DIAG mcp (FAILED/summary каждого прогона) ==="
          for f in /tmp/ci2-mcp-1.log /tmp/ci2-mcp-2.log /tmp/ci2-mcp-3.log; do
            echo "::error::MCP --- ${f} ---"
            sed "s/\r//g" "$f" 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' | grep -aE 'FAILED|ERROR |short test summary|passed|failed|LEDGER|PYTEST' | tail -12 | while IFS= read -r l; do echo "::error::M ${l:0:170}"; done
          done

      - name: "Artifact (mcp: логи всех попыток + level-строки)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci2-mcp-logs
          path: |
            /tmp/ci2-gate.log
            /tmp/ci2-gate-mcp.log
            /tmp/ci2-mcp-*.log
            /tmp/ci2-levels.txt
          if-no-files-found: ignore

  verdict:
    name: "Verdict (4 уровня D-147 + CI-2 Stability D-174)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [static, gdunit, mcp]
    if: always()
    steps:
      - name: "4-уровневая строка (D-147: GdUnit4 / MCP / DOCS-LINKS / exit-код)"
        # Репортёр, не гейт: workflow-красный идёт от gate-job'ов (static/gdunit/mcp).
        # Свита exit-code: 0 ⇔ все три success. Счётчики (2474/38) — в артефактах
        # ci2-gdunit-logs / ci2-mcp-logs (level-строки); ::notice:: — публичный канал
        # без токена (D-167-семья).
        run: |
          S_STATIC="${{ needs.static.result }}"
          S_GDUNIT="${{ needs.gdunit.result }}"
          S_MCP="${{ needs.mcp.result }}"
          EXIT=0
          for r in "$S_STATIC" "$S_GDUNIT" "$S_MCP"; do
            [ "$r" = "success" ] || EXIT=1
          done
          LINE="CI2-VERDICT: GdUnit4=$S_GDUNIT | MCP=$S_MCP | DOCS-LINKS(static)=$S_STATIC | exit-code=$EXIT"
          echo "$LINE"
          echo "::notice::$LINE"

      - name: "CI-2 Stability (D-174: последние 5 прогонов + авто-флаг)"
        # D-174 (раунд 13 §4; перенумерация: D-171→№17, D-172→№18, D-173→№19 — номера заняты параллельными сессиями): сериальный мониторинг гейта. Публичный API
        # (без токена, публичное репо — D-167-семья): статусы workflow-ранов.
        # Текущий ран не учитывается (в момент запроса он in_progress) —
        # флаг срабатывает на следующем ране: это мониторинг, не гейт.
        run: |
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs"
          if ! curl -sf "$API?per_page=10" -H "Accept: application/vnd.github+json" -o /tmp/ci2-runs.json; then
            echo "CI-STABILITY: API недоступен — счётчик пропущен (явно)"
            exit 0
          fi
          python3 - << 'PYEOF'
          import json
          runs = json.load(open('/tmp/ci2-runs.json')).get('workflow_runs', [])
          seq = []
          for r in runs:
              if r.get('status') != 'completed':
                  continue
              seq.append('G' if r.get('conclusion') == 'success' else 'R')
              if len(seq) == 5:
                  break
          print("CI-STABILITY: last 5 runs (newest first): " +
                (" ".join(seq) if seq else "(нет завершённых ранов)"))
          reds = 0
          for s in seq:
              if s == 'R':
                  reds += 1
              else:
                  break
          if reds >= 3:
              print("::warning::CI-STABILITY: %d consecutive red runs — "
                    "системная причина вероятнее кодовой (D-166)" % reds)
          PYEOF
