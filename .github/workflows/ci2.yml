# CI-2 (тикет CI-2, TICKETS.md): GitHub Actions — гейт 4 уровня + чекеры + artifact-логи.
# Гейт = GdUnit4 + MCP e2e (run_tests.sh, таблица exit-кодов закодирована в скрипте:
# GdUnit 0/101 → зелёный, 100/105 → красный; pytest 0 → зелёный, 1/2/3/5 → красный)
# + DOCS-LINKS (check_docs_links.py, битая ссылка → красный) + чекеры (ci2_checkers.sh:
# пары .gd/.uid и ассет/.import, case-дубли, маркеры конфликтов).
# Райдер парности (13-я итерация §0): чекеры — на PR, не только на main.
name: CI-2

on:
  push: # AC тикета CI-2: «на каждый push/PR»
    branches: ['**']
  pull_request:

concurrency:
  group: ci2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate (GdUnit4 + MCP e2e + DOCS-LINKS + checkers)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: System deps (Xvfb — MCP e2e запускает живой Godot, не headless; Godot runtime-libs)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libfontconfig1 libxcursor1 libxinerama1 \
            libxrandr2 libxi6 libgl1 libasound2t64 libpulse0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Python venv (pytest + pytest-timeout + mcp + anyio)
        run: |
          python3 -m venv /tmp/ci2-mcp-venv
          /tmp/ci2-mcp-venv/bin/pip install -q pytest pytest-timeout mcp anyio

      - name: Godot 4.7-stable (linux x86_64)
        run: |
          curl -sfL https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7-stable_linux.x86_64
          /tmp/godot/Godot_v4.7-stable_linux.x86_64 --version

      - name: MCP server (npm ci + build)
        working-directory: game/addons/godot-mcp
        run: npm ci && npm run build

      - name: Checkers (uid pairs, case dups, conflict markers, asset+.import)
        run: bash scripts/ci2_checkers.sh

      - name: "Lint (gdtoolkit: gdparse — gate; gdlint — delta-гейт этапа 1, D-172)"
        # Раунд 10 §3.4: lint — отдельный шаг. gdparse (синтаксис) гейтит.
        # Раунд 9 §3 (gdlint этап 1, GDLINT-PROPOSAL «утверждён»): гигиена
        # (trailing-whitespace/mixed-tabs/unnecessary-pass/is_finite) вычищена
        # (431+2); гейт — ДЕЛЬТА: число нарушений > baseline = красный,
        # ≤ baseline = report-only. Понижать baseline можно только вниз
        # (списанием max-line-length/duplicated-load), raising = красный CI.
        run: |
          python3 -m venv /tmp/ci2-lint-venv
          /tmp/ci2-lint-venv/bin/pip install -q gdtoolkit==4.5.0
          cd game
          find scripts tests -name "*.gd" -print0 \
            | xargs -0 -n50 /tmp/ci2-lint-venv/bin/gdparse
          find scripts tests -name "*.gd" -print0 \
            | xargs -0 -n50 /tmp/ci2-lint-venv/bin/gdlint 2>/tmp/ci2-gdlint.txt >/dev/null || true
          N=$(grep -cE '\.gd:[0-9]+: Error' /tmp/ci2-gdlint.txt || true)
          BASELINE=335
          echo "GDLINT: violations=$N baseline=$BASELINE (дельта-гейт этапа 1)"
          if [ "$N" -gt "$BASELINE" ]; then
            echo "RED: gdlint вырос над baseline (+$((N-BASELINE))) — новые нарушения стиля не принимаются"
            grep -E '\.gd:[0-9]+: Error' /tmp/ci2-gdlint.txt | head -50
            exit 1
          fi

      - name: "Gate 1/3: GdUnit4 (эшелонирование, раунд 7 §1.3)"
        env:
          GODOT_BIN: /tmp/godot/Godot_v4.7-stable_linux.x86_64
          MCP_PYTEST_PY: /tmp/ci2-mcp-venv/bin/python
        run: |
          # Эшелонирование: суб-гейты отдельными шагами — пал суб-гейт видно
          # без тела лога (jobs-API conclusion). Флаг exit-кодов — в run_tests.sh.
          cd game
          "$GODOT_BIN" --headless --path . --import >/dev/null 2>&1 || true
          "$GODOT_BIN" --headless --path . -s addons/gdunit4/bin/GdUnitCmdTool.gd \
            --ignoreHeadlessMode -c -a res://tests 2>&1 | tee /tmp/ci2-gdunit.log
          RC=${PIPESTATUS[0]}
          echo "GDUNIT RC=$RC (0/101 = зелёный, политика CI-2/T-114)"
          [ "$RC" -eq 0 ] || [ "$RC" -eq 101 ]

      - name: "Gate 2/3: MCP e2e (ретраи CI-1(12) на раннер-окружение)"
        env:
          GODOT_BIN: /tmp/godot/Godot_v4.7-stable_linux.x86_64
          MCP_PYTEST_PY: /tmp/ci2-mcp-venv/bin/python
        run: |
          # Ретрай-политика CI-1(12) распространена на раннер явно (раунд 7 §1.3):
          # холодное окружение/шаренная среда дают «Not connected to game
          # interaction server» — до 3 попыток, лог каждой сохраняется.
          cd game
          RC=1
          for attempt in 1 2 3; do
            echo "=== MCP attempt $attempt ==="
            SKIP_GDUNIT=1 bash run_tests.sh > /tmp/ci2-mcp-$attempt.log 2>&1 && RC=0 || RC=$?
            if [ "$RC" -eq 0 ]; then break; fi
            echo "MCP attempt $attempt failed (rc=$RC)"
            sleep 15
          done
          cat /tmp/ci2-mcp-$attempt.log
          cp /tmp/ci2-mcp-$attempt.log /tmp/ci2-gate-mcp.log
          exit "$RC"

      - name: "Gate 3/3: DOCS-LINKS (check_docs_links.py)"
        run: |
          set -o pipefail
          python3 scripts/check_docs_links.py 2>&1 | tee -a /tmp/ci2-gate.log

      - name: "Balance metrics (T-041: трассы композита → artifact, не гейт)"
        # Гейт якорей — тесты test_t041_anchors (Gate 1); шаг пишет трассы
        # баланс-прогона (кривые запасов, WARN/DEFICIT, Престиж-сальдо,
        # потери) в артефакт — baseline-точка регрессии чисел.
        env:
          GODOT_BIN: /tmp/godot/Godot_v4.7-stable_linux.x86_64
        run: |
          cd game
          "$GODOT_BIN" --headless --path . --script res://scripts/balance/balance_metrics.gd \
            2>&1 | tee /tmp/ci2-balance.log | grep -a ANCHOR || true
        continue-on-error: true

      - name: "Artifact (balance report)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balance-report
          path: |
            game/balance_report.json
            /tmp/ci2-balance.log

      - name: "Diagnostics (if: failure — раунд 7 §1.3 п.1: диагноз в видимый лог)"
        if: failure()
        env:
          GODOT_BIN: /tmp/godot/Godot_v4.7-stable_linux.x86_64
        run: |
          echo "=== godot --version ==="; /tmp/godot/Godot_v4.7-stable_linux.x86_64 --version || true
          echo "=== GODOT_BIN resolution ==="; echo "GODOT_BIN=$GODOT_BIN"; ls -la /tmp/godot/ || true; command -v godot || echo "command -v godot: пусто (ожидаемо на раннере)"
          echo "=== DISPLAY / Xvfb ==="; echo "DISPLAY=${DISPLAY:-пусто}"; pgrep -af Xvfb || echo "Xvfb: процессов нет"; command -v xdpyinfo || echo "xdpyinfo: не установлен"
          echo "=== python venv (MCP) ==="; /tmp/ci2-mcp-venv/bin/python -c "import mcp, anyio, pytest; print('mcp/anyio/pytest — ок')" || true
          echo "=== node ==="; node --version; ls game/addons/godot-mcp/build/index.js || echo "MCP server build отсутствует"
          echo "=== tail: gdunit log ==="; tail -40 /tmp/ci2-gdunit.log 2>/dev/null || echo "(нет)"
          echo "=== tail: mcp logs ==="; for f in /tmp/ci2-mcp-*.log; do echo "--- $f"; tail -40 "$f"; done 2>/dev/null || echo "(нет)"
          # Канал без токена: ::error::-аннотации публичны через
          # GET /repos/{o}/{r}/check-runs/{id}/annotations (проверено 2026-10-12).
          # Исполнитель читает диагноз без доступа к телу лога (раунд 7 §1.3).
          emit() { sed "s/\r//g" "$1" 2>/dev/null | grep -aE "$2" | grep -avE 'Statistics|PASSED|Node.js 20' | tail -14 | while IFS= read -r l; do echo "::error::${l:0:180}"; done; }
          echo "::error::=== DIAG gdunit (итог/падения) ==="
          sed "s/\r//g" /tmp/ci2-gdunit.log 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' | grep -aE 'Overall Summary|FAILED|Parse Error|Can.t load' | tail -12 | while IFS= read -r l; do echo "::error::G1 ${l:0:170}"; done
          echo "::error::=== DIAG mcp (FAILED/summary каждого прогона) ==="
          for f in /tmp/ci2-mcp-1.log /tmp/ci2-mcp-2.log /tmp/ci2-mcp-3.log; do
            echo "::error::MCP --- ${f} ---"
            sed "s/\r//g" "$f" 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' | grep -aE 'FAILED|ERROR |short test summary|passed|failed|LEDGER|PYTEST' | tail -12 | while IFS= read -r l; do echo "::error::M ${l:0:170}"; done
          done

      - name: Artifact (gate logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci2-gate-logs
          path: |
            /tmp/ci2-gate.log
            /tmp/ci2-gdunit.log
            /tmp/ci2-gate-mcp.log
            /tmp/ci2-mcp-*.log
      - name: "CI-2 Stability (D-174: последние 5 прогонов + авто-флаг)"
        # D-174 (раунд 13 §4; перенумерация: D-171→№17, D-172→№18, D-173→№19 — номера заняты параллельными сессиями): сериальный мониторинг гейта. Публичный API
        # (без токена, публичное репо — D-167-семья): статусы workflow-ранов.
        # Текущий ран не учитывается (в момент запроса он in_progress) —
        # флаг срабатывает на следующем ране: это мониторинг, не гейт.
        if: always()
        run: |
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs"
          if ! curl -sf "$API?per_page=10" -H "Accept: application/vnd.github+json" -o /tmp/ci2-runs.json; then
            echo "CI-STABILITY: API недоступен — счётчик пропущен (явно)"
            exit 0
          fi
          python3 - << 'PYEOF'
          import json
          runs = json.load(open('/tmp/ci2-runs.json')).get('workflow_runs', [])
          seq = []
          for r in runs:
              if r.get('status') != 'completed':
                  continue
              seq.append('G' if r.get('conclusion') == 'success' else 'R')
              if len(seq) == 5:
                  break
          print("CI-STABILITY: last 5 runs (newest first): " +
                (" ".join(seq) if seq else "(нет завершённых ранов)"))
          reds = 0
          for s in seq:
              if s == 'R':
                  reds += 1
              else:
                  break
          if reds >= 3:
              print("::warning::CI-STABILITY: %d consecutive red runs — "
                    "системная причина вероятнее кодовой (D-166)" % reds)
          PYEOF
